prompt_name: SLTPvM_vision
prompt_version: v-1-1
instructions: |
  1. Read the herbarium specimen label in the image and extract data into a JSON object.
  2. Use only the JSON keys listed in the rules below; leave missing fields as empty strings.
  3. All keys must be camelCase. Return valid JSON only, no explanation.
json_formatting_instructions: Follow each field rule strictly. Correct minor OCR-like errors when obvious.
rules:
  catalogNumber: Barcode identifier, typically 6–30 digits.
  scientificName: Full scientific name including genus and epithet.
  genus: Genus, capitalized; or family name followed by 'indet' if genus absent.
  specificEpithet: Species epithet only.
  scientificNameAuthorship: Authorship per nomenclatural code.
  collectedBy: Collectors, primary first, comma-separated.
  collectorNumber: Collector's number.
  identifiedBy: Determiners, not collectors.
  identifiedDate: Date of determination. ISO 8601 only — full YYYY-MM-DD, or YYYY-MM if day unknown, or YYYY if only year (e.g. 2003). Never use 00 for month or day (not 2003-00-00). Empty string if no date on label.
  identifiedConfidence: Short determination qualifiers (? cf. aff. etc.).
  identifiedRemarks: Longer determination notes.
  identificationHistory: Prior determinations with dates and determiners.
  verbatimCollectionDate: Date exactly as on label.
  collectionDate: Collection date; same ISO rules as identifiedDate (YYYY, YYYY-MM, or YYYY-MM-DD; never -00-).
  collectionDateEnd: End of collection date range; same ISO rules, or empty.
  habitat: Habitat description.
  specimenDescription: Specimen notes (color, measurements, etc.).
  cultivated: "If the text includes 'cult' or 'cultivated', set this field to yes."
  continent: Continent of collection.
  country: Country of collection.
  stateProvince: State or province.
  county: County or equivalent.
  locality: Locality description.
  verbatimCoordinates: Coordinates as on label.
  decimalLatitude: Decimal degrees latitude.
  decimalLongitude: Decimal degrees longitude.
  minimumElevationInMeters: Minimum elevation in meters.
  maximumElevationInMeters: Maximum elevation in meters.
  additionalText: Other label text not mapped above.
  labelType: >
    Type of label writing. Use exactly one of: "handwritten" (text written by hand),
    "printed" (typeset or machine-printed text), "mixed" (combination of both),
    or "unknown" (cannot determine).
