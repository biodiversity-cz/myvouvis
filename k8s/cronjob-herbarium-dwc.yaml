apiVersion: batch/v1
kind: CronJob
metadata:
  name: herbarium-dwc
  namespace: databots
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: bot
              image: ghcr.io/biodiversity-cz/myvouvis:latest
              imagePullPolicy: Always
              args: ["herbarium-dwc"]
              envFrom:
                - secretRef:
                    name: vouvis-creds
              env:
                - name: OPENAI_BASE_URL
                  value: "https://llm.ai.e-infra.cz/v1/"
              resources:
                requests:
                  memory: "4Gi"
                  cpu: "1"
                limits:
                  memory: "16Gi"
                  cpu: "4"
