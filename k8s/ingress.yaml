# Ingress zarovnaný na biodiversity-cz/myhespi (k8s/ingress.yaml tam v repu):
#   stejné anotace velikosti těla + custom-http-errors + pathType ImplementationSpecific.
# Max upload aplikace: vv_api max_upload_bytes (default 20 MiB) — nižší než 100m na Ingress.
# Timeouts: align s gunicorn --timeout 180 a REQUEST_TIMEOUT_S=180.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vouvis-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/custom-http-errors: "599"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.org/client-max-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vouvis.biodiversity.cz
      secretName: vouvis-biodiversity-cz-tls
  rules:
    - host: vouvis.biodiversity.cz
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: vouvis-api
                port:
                  number: 80
