# Adjust host / class for your cluster (nginx, traefik, etc.).
# Timeouts: align with gunicorn --timeout 180 and REQUEST_TIMEOUT_S=180.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vouvis-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: vouvis.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vouvis-api
                port:
                  number: 80
