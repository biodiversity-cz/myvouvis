apiVersion: apps/v1
kind: Deployment
metadata:
  name: vouvis-api
  namespace: pokorny1-ns
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  selector:
    matchLabels:
      app: vouvis-api
  template:
    metadata:
      labels:
        app: vouvis-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Workflow docker-publish.yml: ghcr.io + lowercase(repository); tag latest on main
          image: ghcr.io/biodiversity-cz/myvouvis:latest
          imagePullPolicy: Always
          command: ["uvicorn"]
          args: ["api.app:app", "--host", "0.0.0.0", "--port", "8080"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: vouvis-creds
          env:
            - name: OPENAI_BASE_URL
              value: "https://llm.ai.e-infra.cz/v1/"
            # Model switch (if not in Secret): gpt-oss-120b | deepseek-v3.2-thinking | qwen3.5-122b
            # - name: OPENAI_LLM_PRESET
            #   value: "gpt-oss-120b"
            - name: REQUEST_TIMEOUT_S
              value: "180"
          # Optional GPU: uncomment and use a cluster with nvidia.com/gpu
          # resources:
          #   limits:
          #     nvidia.com/gpu: 1
          #     memory: "16Gi"
          #     cpu: "4"
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "16Gi"
              cpu: "8"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
