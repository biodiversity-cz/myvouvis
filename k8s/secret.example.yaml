# Example only — copy to secret.yaml and apply after replacing placeholders.
# kubectl create namespace myvouvis
# kubectl apply -f secret.yaml -n myvouvis
apiVersion: v1
kind: Secret
metadata:
  name: vouvis-creds
type: Opaque
stringData:
  # e-INFRA (or any OpenAI-compatible) API key from chat / portal
  OPENAI_API_KEY: "replace-me"
  # If your platform expects a different model id than the VoucherVision mapping:
  # OPENAI_LLM_MODEL: "your-model-alias"
  GOOGLE_PROJECT_ID: "replace-me"
  GOOGLE_LOCATION: "us-central1"
  # Full JSON of the Google service account (Vision + optional Drive); same
  # convention as VoucherVision is_hf mode: JSON string, not a file path.
  GOOGLE_APPLICATION_CREDENTIALS: |
    {
      "type": "service_account",
      "project_id": "your-project"
    }
