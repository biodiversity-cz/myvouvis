apiVersion: v1
kind: Pod
metadata:
  name: lm2-download
  namespace: pokorny1-ns
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: download
      image: alpine:3.20
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: lm2-weights
          mountPath: /models/lm2
  volumes:
    - name: lm2-weights
      persistentVolumeClaim:
        claimName: myvouvis-lm2-weights

