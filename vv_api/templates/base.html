<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}myVoucherVision{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  <footer class="container py-4 app-site-footer">
    <hr>
    <p class="text-muted small">
      Tento výstup projektu vznikl za finanční podpory iniciativy EOSC CZ prostřednictvím projektu
      Národní repozitářová platforma pro výzkumná data (CZ.02.01.01/00/23_014/0008787)
      financovaného z&nbsp;Operačního programu Jan Amos Komenský (OP&nbsp;JAK) MŠMT.
    </p>
    <div class="d-flex align-items-center gap-4 app-footer-logos">
      <img class="app-footer-logo" src="/static/images/eosc-logo.svg" alt="EOSC CZ" loading="lazy" decoding="async" />
      <img class="app-footer-logo" src="/static/images/eu-msmt.svg" alt="EU a MŠMT" loading="lazy" decoding="async" />
    </div>
  </footer>
</body>
</html>
