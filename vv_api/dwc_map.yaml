# Map VoucherVision / SLTPvM JSON keys to Darwin Core term local names.
# The default prompt already uses camelCase close to DwC; this layer makes
# the contract explicit and allows renaming if your custom prompt differs.

version: 1

# Values are target DwC-style keys as used in many DwC archives (unqualified local names).
field_map:
  catalogNumber: catalogNumber
  scientificName: scientificName
  scientificNameAuthorship: scientificNameAuthorship
  genus: genus
  specificEpithet: specificEpithet
  speciesNameAuthorship: scientificNameAuthorship
  collectedBy: recordedBy
  collectorNumber: recordNumber
  identifiedBy: identifiedBy
  identifiedDate: dateIdentified
  identifiedConfidence: identificationRemarks
  identifiedRemarks: identificationRemarks
  identificationHistory: identificationRemarks
  verbatimCollectionDate: verbatimEventDate
  collectionDate: eventDate
  collectionDateEnd: eventDate
  habitat: habitat
  specimenDescription: occurrenceRemarks
  cultivated: establishmentMeans
  continent: continent
  country: country
  stateProvince: stateProvince
  county: county
  locality: locality
  verbatimCoordinates: verbatimCoordinates
  decimalLatitude: decimalLatitude
  decimalLongitude: decimalLongitude
  minimumElevationInMeters: minimumElevationInMeters
  maximumElevationInMeters: maximumElevationInMeters
  additionalText: occurrenceRemarks

# Optional: fail validation if any of these are empty after mapping (per record).
# Example herbarium profile: [ scientificName, catalogNumber ]
required_terms: []
